<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="stoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673ab7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="braceletGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5722;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Bracelet ring -->
  <ellipse cx="35" cy="30" rx="20" ry="25" fill="none" stroke="url(#braceletGradient)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Stone 1 - Amethyst -->
  <circle cx="35" cy="15" r="6" fill="url(#stoneGradient)" filter="url(#shadow)"/>
  <circle cx="35" cy="15" r="3" fill="#fff" opacity="0.3"/>
  
  <!-- Stone 2 - Rose Quartz -->
  <circle cx="50" cy="30" r="6" fill="url(#stoneGradient)" filter="url(#shadow)"/>
  <circle cx="50" cy="30" r="3" fill="#fff" opacity="0.3"/>
  
  <!-- Stone 3 - Tiger Eye -->
  <circle cx="35" cy="45" r="6" fill="url(#stoneGradient)" filter="url(#shadow)"/>
  <circle cx="35" cy="45" r="3" fill="#fff" opacity="0.3"/>
  
  <!-- Stone 4 - Lapis Lazuli -->
  <circle cx="20" cy="30" r="6" fill="url(#stoneGradient)" filter="url(#shadow)"/>
  <circle cx="20" cy="30" r="3" fill="#fff" opacity="0.3"/>
  
  <!-- Brand name -->
  <text x="75" y="25" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333">
    Univers des
  </text>
  <text x="75" y="45" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="url(#stoneGradient)">
    Pierres
  </text>
  
  <!-- Decorative dot -->
  <circle cx="185" cy="35" r="3" fill="#e91e63"/>
</svg>

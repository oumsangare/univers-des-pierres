<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673ab7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#iconGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Central bracelet -->
  <ellipse cx="50" cy="50" rx="30" ry="35" fill="none" stroke="url(#iconGradient)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Stones arranged in bracelet pattern -->
  <circle cx="50" cy="20" r="8" fill="url(#iconGradient)" filter="url(#glow)"/>
  <circle cx="50" cy="20" r="4" fill="#fff" opacity="0.4"/>
  
  <circle cx="75" cy="35" r="7" fill="url(#iconGradient)" filter="url(#glow)"/>
  <circle cx="75" cy="35" r="3.5" fill="#fff" opacity="0.4"/>
  
  <circle cx="80" cy="55" r="7" fill="url(#iconGradient)" filter="url(#glow)"/>
  <circle cx="80" cy="55" r="3.5" fill="#fff" opacity="0.4"/>
  
  <circle cx="65" cy="75" r="7" fill="url(#iconGradient)" filter="url(#glow)"/>
  <circle cx="65" cy="75" r="3.5" fill="#fff" opacity="0.4"/>
  
  <circle cx="35" cy="75" r="7" fill="url(#iconGradient)" filter="url(#glow)"/>
  <circle cx="35" cy="75" r="3.5" fill="#fff" opacity="0.4"/>
  
  <circle cx="20" cy="55" r="7" fill="url(#iconGradient)" filter="url(#glow)"/>
  <circle cx="20" cy="55" r="3.5" fill="#fff" opacity="0.4"/>
  
  <circle cx="25" cy="35" r="7" fill="url(#iconGradient)" filter="url(#glow)"/>
  <circle cx="25" cy="35" r="3.5" fill="#fff" opacity="0.4"/>
  
  <!-- Small decorative stones -->
  <circle cx="62" cy="28" r="4" fill="#ff5722" opacity="0.8"/>
  <circle cx="38" cy="28" r="4" fill="#ff5722" opacity="0.8"/>
  <circle cx="72" cy="65" r="4" fill="#ff5722" opacity="0.8"/>
  <circle cx="28" cy="65" r="4" fill="#ff5722" opacity="0.8"/>
</svg>

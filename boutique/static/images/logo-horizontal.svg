<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="hStoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673ab7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hBraceletGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5722;stop-opacity:1" />
    </linearGradient>
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Bracelet ring -->
  <ellipse cx="45" cy="40" rx="25" ry="30" fill="none" stroke="url(#hBraceletGradient)" stroke-width="5" filter="url(#hShadow)"/>
  
  <!-- Main stones -->
  <circle cx="45" cy="18" r="8" fill="url(#hStoneGradient)" filter="url(#hShadow)"/>
  <circle cx="45" cy="18" r="4" fill="#fff" opacity="0.3"/>
  
  <circle cx="65" cy="40" r="8" fill="url(#hStoneGradient)" filter="url(#hShadow)"/>
  <circle cx="65" cy="40" r="4" fill="#fff" opacity="0.3"/>
  
  <circle cx="45" cy="62" r="8" fill="url(#hStoneGradient)" filter="url(#hShadow)"/>
  <circle cx="45" cy="62" r="4" fill="#fff" opacity="0.3"/>
  
  <circle cx="25" cy="40" r="8" fill="url(#hStoneGradient)" filter="url(#hShadow)"/>
  <circle cx="25" cy="40" r="4" fill="#fff" opacity="0.3"/>
  
  <!-- Small accent stones -->
  <circle cx="58" cy="25" r="5" fill="#ff5722" opacity="0.8"/>
  <circle cx="32" cy="25" r="5" fill="#ff5722" opacity="0.8"/>
  <circle cx="58" cy="55" r="5" fill="#ff5722" opacity="0.8"/>
  <circle cx="32" cy="55" r="5" fill="#ff5722" opacity="0.8"/>
  
  <!-- Brand name with elegant typography -->
  <text x="95" y="32" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#333" letter-spacing="1">
    Univers des
  </text>
  <text x="95" y="58" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#hStoneGradient)" letter-spacing="2">
    PIERRES
  </text>
  
  <!-- Decorative elements -->
  <circle cx="280" cy="45" r="4" fill="#e91e63"/>
  <circle cx="270" cy="45" r="3" fill="#9c27b0"/>
  <circle cx="260" cy="45" r="2" fill="#673ab7"/>
</svg>
